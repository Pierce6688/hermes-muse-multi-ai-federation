name: 品質回饋 / 质量反馈 / Feedback
description: 重現問題、參數偏差、改進建議 / 复现问题、参数偏差、改进建议 / Repro issues, calibration, ideas
labels: [feedback]
body:
  - type: dropdown
    id: type
    attributes:
      label: 類型 / 类型 / Type
      options:
        - 重現失敗 / 复现失败 / Reproduction failed
        - 參數需校準 / 参数需校准 / Parameters need tuning
        - 內容錯誤 / 内容错误 / Content error
        - 連結失效 / 链接失效 / Broken link
        - 改進建議 / 改进建议 / Improvement idea
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 環境 / 环境 / Environment
      description: 系統版本、工具版本 / 系统版本、工具版本 / OS, tool versions
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 詳情 / 详情 / Details
      description: 經過、期望、重現步驟 / 经过、期望、复现步骤 / what happened, expected, steps
    validations:
      required: true
